name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF and browser test dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils
          python3 -m pip install --upgrade pypdf playwright
          python3 -m playwright install --with-deps chromium
      - name: Run release verification
        run: npm run codex-check
      - uses: actions/upload-artifact@v4
        with:
          name: generated-pdf
          path: |
            sample/vu-minh-hieu-la-so-tu-vi-tong-quan.pdf
            sample/MXiao-Ban-Do-Sao-final.pdf

  pdfua:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-pdf
          path: sample
      - name: Validate PDF/UA-1 with veraPDF 1.30.2
        run: bash scripts/verapdf-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verapdf-report
          path: verapdf-report.xml
